/* 20260916_空闲Tick计算_仿真测点.ini —— A17 高频档观察的调试脚本（µVision 仿真器初始化文件）
 *
 * 由 `Tests/run_cycles.ps1 -IniFile <本文件>` 复制到镜像工作区并替换占位符 `__SIM_LOG__`（绝对路径）后，
 * 通过 `.uvoptx` 的 `<sIfile>` 指定；标签一律 ASCII（避免日志乱码，见技能文档 §3.3）。
 *
 * 判读（g_res 位置见测点文件头）：
 *  - r0 = 采样数        r5 = 异常大值(>=0x80000000)次数
 *  - r1 = 0 的次数      r2 = 见过的最大值
 *  - r3 = 注入次数      r4 = XC_CFG_TICKS_PER_SEC        r6 = 正常小值次数
 * 修复后应为：r5 = 0 且 r1 ≈ r0（"已过点 ⇒ 0"）；修复前 r5 ≈ r0（回绕成 ≈0xFFFFFFFF）。
 */
LOG >__SIM_LOG__

FUNC void DumpRes(void) {
    printf("\r\n===== SIM A17 IDLETICK =====\r\n");
    printf("r0  idle_samples     = %u\r\n", g_res[0]);
    printf("r5  idle_absurd_cnt  = %u\r\n", g_res[1]);
    printf("r1  idle_zero_cnt    = %u\r\n", g_res[2]);
    printf("r2  idle_max         = %u\r\n", g_res[3]);
    printf("r3  inject_cnt       = %u\r\n", g_res[4]);
    printf("r4  ticks_per_sec    = %u\r\n", g_res[5]);
    printf("r6  idle_normal_cnt  = %u\r\n", g_res[6]);
    printf("===== END =====\r\n");
}

g, SimDone
DumpRes()
D &g_res, &g_res+63
