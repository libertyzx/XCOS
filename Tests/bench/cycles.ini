/* cycles.ini —— E1 周期通道的调试脚本（µVision 仿真器初始化文件）
 *
 * 由 `Tests/run_cycles.ps1` 复制到镜像工作区并替换占位符 `__SIM_LOG__`（绝对路径）后，
 * 通过 `.uvoptx` 的 `<sIfile>` 指定；**标签一律 ASCII**（避免日志乱码，见技能文档 §3.3）。
 *
 * 关键点（技能文档 §3.1）：
 *  - `LOG >path`：把 Command 窗口输出（含 printf）落盘；
 *  - `g, <symbol>`：运行到测点程序里的 `SimDone()`（等效临时断点）；
 *  - `EXIT` 在调试脚本里**不生效** ⇒ 收尾由驱动脚本"超时 + Kill 进程 + 读日志"完成。
 */
LOG >__SIM_LOG__

FUNC void DumpRes(void) {
    printf("\r\n===== SIM CYCLES =====\r\n");
    printf("r0  insert_timelist_head = %u\r\n", g_res[0]);
    printf("r5  insert_timelist_tail = %u\r\n", g_res[5]);
    printf("r1  move_ready_tail    = %u\r\n", g_res[1]);
    printf("r2  wake_api_direct    = %u\r\n", g_res[2]);
    printf("r3  wake_in_lockwindow = %u\r\n", g_res[3]);
    printf("r4  resume_task        = %u\r\n", g_res[4]);
    printf("r15 cyc_overhead       = %u\r\n", g_res[15]);
    printf("r13 sizeof_tcb         = %u\r\n", g_res[13]);
    printf("r14 sizeof_xcos        = %u\r\n", g_res[14]);
    printf("===== END =====\r\n");
}

g, SimDone
DumpRes()
D &g_res, &g_res+63
